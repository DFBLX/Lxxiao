<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>拍照识别物品</title>
  <meta name="theme-color" content="#0f172a" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <main class="container">
    <h1>拍照识别物品</h1>
    <p class="subtitle">使用手机摄像头拍照，并基于 TensorFlow.js 模型识别物品。</p>

    <section class="camera-card">
      <video id="video" autoplay playsinline muted></video>
      <canvas id="canvas" class="hidden"></canvas>
      <img id="snapshot" class="hidden" alt="拍照预览" />

      <div class="buttons">
        <button id="startBtn">开启摄像头</button>
        <button id="captureBtn" disabled>拍照识别</button>
        <button id="retryBtn" class="ghost hidden">重新拍照</button>
      </div>
    </section>

    <section class="result-card">
      <h2>识别结果</h2>
      <p id="status">模型加载中，请稍候...</p>
      <ul id="results"></ul>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.3"></script>
  <script src="/mobile-app.js"></script>
</body>
</html>
